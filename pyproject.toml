[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "microphone-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented local audio input capture"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
microphone-claim-audit = "microphone_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["microphone_claim_audit*"]
